version: '3.8'

services:
  vllm-production:
    image: vllm/vllm-openai:v0.31.0
    container_name: vllm-prod-server
    restart: on-failure:3
    ipc: host
    ports:
      - "${HOST_PORT:-8000}:${CONTAINER_PORT:-8000}"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - VLLM_LOGGING_LEVEL=INFO
    volumes:
      - ${CACHE_DIR:-~/.cache/huggingface}:/root/.cache/huggingface
      - ~/.cache/vllm:/root/.cache/vllm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: [
      "${MODEL_ID:-Qwen/Qwen3.8-27B-FP8}",
      "--host", "0.0.0.0",
      "--port", "${CONTAINER_PORT:-8000}",
      "--served-model-name", "${SERVED_MODEL_NAME:-qwen3.8-27b}",

      # Memory & Precision Optimization for NVIDIA L40S (48 GB)
      "--gpu-memory-utilization", "${GPU_MEMORY_UTILIZATION:-0.85}",
      "--kv-cache-dtype", "${KV_CACHE_DTYPE:-fp8}",

      # Concurrency & CUDA Graph Compilation
      "--max-num-seqs", "${MAX_NUM_SEQS:-16}",
      "--compilation-config", '{"max_cudagraph_capture_size":16}',

      # Context Window & Chunked Prefill
      "--max-model-len", "${MAX_MODEL_LEN:-16384}",
      "--max-num-batched-tokens", "${MAX_NUM_BATCHED_TOKENS:-4192}",
      "--enable-prefix-caching",

      # Skip Vision Modality Allocation for Text/Coding Workloads
      "--limit-mm-per-prompt", '{"image":0,"video":0}',

      # Tool Calling & Agent Support
      "--enable-auto-tool-choice",
      "--tool-call-parser", "hermes",

      # Force vLLM Defaults to Prevent Model Generation Config Temperature Overrides
      "--generation-config", "vllm"
    ]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${CONTAINER_PORT:-8000}/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 180s
