version: '3.8'

services:
  vllm-production:
    image: vllm/vllm-openai:v0.6.3
    container_name: vllm-prod-server
    restart: unless-stopped
    ipc: host
    ports:
      - "${HOST_PORT:-8000}:${CONTAINER_PORT:-8000}"
    environment:
      - HF_HOME=/model-cache
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      - VLLM_LOGGING_LEVEL=INFO
    volumes:
      - ${CACHE_DIR:-/data/model-cache}:/model-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model ${MODEL_ID:-Qwen/Qwen3-Coder-30B-A3B-Instruct-FP8}
      --served-model-name ${SERVED_MODEL_NAME:-qwen3-coder-30b}
      --host 0.0.0.0
      --port ${CONTAINER_PORT:-8000}
      --tensor-parallel-size ${TENSOR_PARALLEL_SIZE:-1}
      --max-model-len ${MAX_MODEL_LEN:-32768}
      --max-num-batched-tokens ${MAX_NUM_BATCHED_TOKENS:-2048}
      --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.92}
      --kv-cache-dtype ${KV_CACHE_DTYPE:-fp8}
      --enable-prefix-caching
      --enable-auto-tool-choice
      --tool-call-parser hermes
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${CONTAINER_PORT:-8000}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
